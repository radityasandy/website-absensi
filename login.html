
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Informasi Absensi</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f1f1f1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 260px;
            padding: 19px 32px 25px;
            border-radius: 17px;
            background: linear-gradient(
                155deg,
                #0788f7,
                #3d50ff,
                #c000f2
            );
        }

        h1 {
            text-align: center;
            font-size: 35px;
            margin-bottom: 0;
            color: #000;
        }

        .subtitle {
            text-align: center;
            font-size: 11px;
            margin-bottom: 8px;
        }

        .logo {
            display: block;
            width: 72px;
            height: 78px;
            object-fit: contain;
            margin: 0 auto 12px;
        }

        .form-group {
            margin-bottom: 13px;
        }

        label {
            font-size: 7px;
            font-weight: bold;
            display: block;
        }

        input {
            width: 100%;
            height: 30px;
            margin-top: 13px;
            padding: 0 15px;
            border: 1px solid #555;
            border-radius: 4px;
            outline: none;
            font-size: 8px;
        }

        input:focus {
            border-color: blue;
        }

        button {
            width: 100%;
            height: 31px;
            border: none;
            border-radius: 4px;
            background: white;
            color: black;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #eeeeee;
        }

        .powered {
            position: fixed;
            bottom: 38px;
            text-align: center;
            font-size: 17px;
            width: 100%;
        }

        @media (max-width: 400px) {
            .powered {
                font-size: 14px;
                bottom: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>LOGIN</h1>

        <p class="subtitle">
            Sistem Informasi Absensi dan<br>
            Prestasi Siswa SMA
        </p>

        <img src="logo.png" alt="Logo Sekolah" class="logo">

        <form id="loginForm">

            <div class="form-group">
                <label for="email">EMAIL</label>
                <input
                    type="email"
                    id="email"
                    placeholder="contoh: syber@gmail.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">KATA SANDI</label>
                <input
                    type="password"
                    id="password"
                    placeholder="contoh: $Al_Ahaja456#"
                    required
                >
            </div>

            <button type="submit">
                Login &nbsp; →
            </button>

        </form>

    </div>

    <div class="powered">
        Powered by @projekweb kel 1
    </div>

    <script>
        document.getElementById("loginForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            if (email && password) {
                alert("Form login berhasil diisi!");
            }

        });
    </script>

</body>
</html>
