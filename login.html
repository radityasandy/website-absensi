
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Informasi Absensi</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>LOGIN</h1>

        <p class="subtitle">
            Sistem Informasi Absensi dan<br>
            Prestasi Siswa SMA
        </p>

        <img src="logo.png" alt="Logo Sekolah" class="logo">

        <form id="loginForm">

            <div class="form-group">
                <label for="email">EMAIL</label>
                <input
                    type="email"
                    id="email"
                    placeholder="contoh: syber@gmail.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">KATA SANDI</label>
                <input
                    type="password"
                    id="password"
                    placeholder="contoh: $Al_Ahaja456#"
                    required
                >
            </div>

            <button type="submit">
                Login <span>→</span>
            </button>

        </form>

    </div>

    <div class="powered">
        Powered by @projekweb kel 1
    </div>

    <script src="script.js"></script>
</body>
</html>
